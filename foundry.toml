[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 1000
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
base = "${RPC_URL_BASE}"
base_sepolia = "${RPC_URL_BASE_SEPOLIA}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
